<!DOCTYPE html>

<body>
<form method="POST">
    {{ form.hidden_tag() }}
    <div class="form-floating mb-2">
        <input type="text" class="form-control" id="prompt_" name="prompt" placeholder="hello">
        <label form="prompt">You:</label>

     <button type="submit" class="btn btn-primary mb-2">Send</button>

    {% if response %}
        <div class="form-floating mb-2">
        <textarea class="form-control" id="response" readonly style="height: 150px;">{{ response }}</textarea>
        <label for="response">Gemini:</label>
        </div>
    {% endif %}
</body>
